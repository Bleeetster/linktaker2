<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            padding: 12px;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 500;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
        .links-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }
        .link-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            gap: 6px;
        }
        .link-item:last-child {
            border-bottom: none;
        }
        .link-info {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            line-height: 1.4;
        }
        .link-title {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-url {
            font-size: 11px;
            color: #0066cc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #555;
            transition: background 0.2s, color 0.2s;
        }
        button:hover {
            background: #e0e0e0;
            color: #000;
        }
        button:active {
            background: #ccc;
        }
        .delete-btn:hover {
            background: #ffebee;
            color: #c62828;
        }
        .clear-btn {
            width: 100%;
            padding: 8px;
            font-size: 13px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            color: #d32f2f;
            font-weight: 500;
            transition: background 0.2s;
        }
        .clear-btn:hover {
            background: #ffebee;
            border-color: #d32f2f;
        }
        .empty-message {
            padding: 20px;
            text-align: center;
            color: #888;
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>📌 Мои ссылки</h3>
        <div class="links-list" id="linksList"></div>
        <button class="clear-btn" id="clearAllBtn">🗑️ Очистить всё</button>
    </div>

    <!-- Шаблон для одной ссылки -->
    <template id="linkTemplate">
        <div class="link-item">
            <div class="link-info">
                <div class="link-title"></div>
                <div class="link-url"></div>
            </div>
            <div class="item-actions">
                <!-- <button class="move-up-btn" title="Переместить вверх">⬆️</button> -->
                <!-- <button class="move-down-btn" title="Переместить вниз">⬇️</button> -->
                <button class="delete-btn" title="Удалить">❌</button>
            </div>
        </div>
    </template>

    <script type="module", src="storage-manager.js"></script>
</body>
</html>
